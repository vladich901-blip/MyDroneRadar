<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alerts</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--tx:var(--tg-theme-text-color,#111);--hint:var(--tg-theme-hint-color,#777);--card:var(--tg-theme-secondary-bg-color,#f1f1f1);--btn:var(--tg-theme-button-color,#2481cc);--btx:var(--tg-theme-button-text-color,#fff)}
@media(prefers-color-scheme:dark){:root{--bg:var(--tg-theme-bg-color,#17212b);--tx:var(--tg-theme-text-color,#fff);--hint:var(--tg-theme-hint-color,#8a98a6);--card:var(--tg-theme-secondary-bg-color,#232e3c)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;padding-bottom:70px}
main{padding:12px;max-width:900px;margin:auto}nav{position:fixed;bottom:0;left:0;right:0;display:flex;overflow-x:auto;background:var(--card);padding:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
nav button{flex:0 0 auto;border:0;background:none;color:var(--hint);padding:8px 12px;border-radius:10px;font-size:13px}nav button.on{background:var(--btn);color:var(--btx)}
.card{background:var(--card);border-radius:12px;padding:12px;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.tile{border-radius:10px;padding:10px;min-height:56px;font-size:13px;background:#1f9d5540}.tile small{display:block;color:var(--hint)}.tile.alert{background:#e5393580}.tile.ended{background:#f9a82560}
.b{display:inline-block;font-size:12px;padding:2px 8px;border-radius:8px;background:#8884}.b.official{background:#1f9d5560}.b.unconfirmed{background:#f9a82560}
select,button.a,input{font:inherit;padding:8px;border-radius:8px;border:1px solid #8884;background:var(--bg);color:var(--tx);margin:3px 0}button.a{background:var(--btn);color:var(--btx);border:0}
table{width:100%;border-collapse:collapse}td{padding:6px;border-bottom:1px solid #8883}label{display:block;margin:4px 0}
</style></head><body><main id="m"></main><nav id="n"></nav>
<script>
const tg=Telegram.WebApp;tg.ready();tg.expand();
const L={
uk:{home:'Головна',map:'Карта',alerts:'Тривоги',history:'Історія',favs:'Обране',stats:'Статистика',safety:'Безпека',profile:'Профіль',alert:'Тривога',ended:'Відбій',clear:'Немає тривоги',official:'Офіційно підтверджено',confirming:'Підтверджується',unconfirmed:'Не підтверджено',alarm:'Повітряна тривога',missile:'Ракетна загроза',uav:'Загроза БПЛА',warning:'Попередження',info:'Інформація',day:'День',week:'Тиждень',month:'Місяць',save:'Зберегти',lang:'Мова',region:'Область',all:'Усі',empty:'Немає даних',count:'Кількість',total:'Тривалість',notif:'Сповіщення',off1:'Вимкнути на 1 год',off8:'Вимкнути на 8 год',on:'Увімкнути',add:'Додати',del:'Видалити',nearest:'Найближче укриття',now:'Зараз у тривозі',enabled:'Сповіщення увімкнено',types:'Типи',links:'Офіційні ресурси'},
ru:{home:'Главная',map:'Карта',alerts:'Тревоги',history:'История',favs:'Избранное',stats:'Статистика',safety:'Безопасность',profile:'Профиль',alert:'Тревога',ended:'Отбой',clear:'Нет тревоги',official:'Официально подтверждено',confirming:'Подтверждается',unconfirmed:'Не подтверждено',alarm:'Воздушная тревога',missile:'Ракетная угроза',uav:'Угроза БПЛА',warning:'Предупреждение',info:'Информация',day:'День',week:'Неделя',month:'Месяц',save:'Сохранить',lang:'Язык',region:'Область',all:'Все',empty:'Нет данных',count:'Количество',total:'Длительность',notif:'Уведомления',off1:'Отключить на 1 ч',off8:'Отключить на 8 ч',on:'Включить',add:'Добавить',del:'Удалить',nearest:'Ближайшее укрытие',now:'Сейчас в тревоге',enabled:'Уведомления включены',types:'Типы',links:'Официальные ресурсы'},
en:{home:'Home',map:'Map',alerts:'Alerts',history:'History',favs:'Favorites',stats:'Stats',safety:'Safety',profile:'Profile',alert:'Alert',ended:'All clear',clear:'No alert',official:'Officially confirmed',confirming:'Being confirmed',unconfirmed:'Unconfirmed',alarm:'Air raid alert',missile:'Missile threat',uav:'UAV threat',warning:'Warning',info:'Information',day:'Day',week:'Week',month:'Month',save:'Save',lang:'Language',region:'Region',all:'All',empty:'No data',count:'Count',total:'Duration',notif:'Notifications',off1:'Mute for 1 h',off8:'Mute for 8 h',on:'Unmute',add:'Add',del:'Remove',nearest:'Nearest shelter',now:'Currently in alert',enabled:'Notifications enabled',types:'Types',links:'Official resources'}};
const TABS=['home','map','alerts','history','favs','stats','safety','profile'];
const S={me:null,regions:[],tab:'home',f:{period:'day',region:'',kind:''},sp:'day'};
const $=id=>document.getElementById(id);
const t=k=>(L[S.me.lang]||L.uk)[k]||k;
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const H={'X-Init-Data':tg.initData,'Content-Type':'application/json'};
async function api(p,o={}){const r=await fetch('/api'+p,{headers:H,...o});if(!r.ok)throw new Error(r.status);return r.json()}
const put=b=>api('/me',{method:'PUT',body:JSON.stringify(b)});
const fmt=s=>new Date(s).toLocaleString(S.me.lang);
const dur=(a,b)=>{const m=Math.round(((b?new Date(b):new Date())-new Date(a))/60000);return m>=60?Math.floor(m/60)+'h '+m%60+'m':m+'m'};
const hm=s=>{const m=Math.round(s/60);return m>=60?Math.floor(m/60)+'h '+m%60+'m':m+'m'};
const sel=(opts,val,fn)=>`<select onchange="${fn}">${opts.map(o=>`<option value="${e(o[0])}" ${o[0]==val?'selected':''}>${e(o[1])}</option>`).join('')}</select>`;
const regOpts=(all)=>[[ '',all?t('all'):'—'],...S.regions.map(r=>[r.region,r.region])];
const ev=x=>`<div class="card"><b>${t(x.kind)}</b> · ${e(x.region)}<br><span class="b ${x.verification}">${x.verification=='unconfirmed'?'⚠ ':''}${t(x.verification)}</span><br><small>${fmt(x.started)}${x.ended?' → '+fmt(x.ended)+' · '+dur(x.started,x.ended):' · '+dur(x.started)}<br>${e(x.sources.join(', '))}</small></div>`;
const tile=r=>`<div class="tile ${r.status}">${e(r.region.replace(' область',''))}<small>${t(r.status)}${r.kinds.length?' · '+r.kinds.map(t).join(', '):''}</small></div>`;
const none=`<p>${'—'}</p>`;
const V={
async home(){const x=await api('/events?period=day&limit=5');const n=S.regions.filter(r=>r.status=='alert').length;const mine=S.regions.find(r=>r.region==S.me.region);return `<div class="card"><h3>${t('now')}: ${n}</h3>${mine?tile(mine):''}</div>`+(x.map(ev).join('')||none)},
async map(){return `<div class="grid">${S.regions.map(tile).join('')}</div>`},
async alerts(){const x=await api('/events?active=true');return x.map(ev).join('')||none},
async history(){const f=S.f;const q=new URLSearchParams({period:f.period,region:f.region,kind:f.kind});const x=await api('/events?'+q);
return sel([['day',t('day')],['week',t('week')],['month',t('month')]],f.period,"S.f.period=this.value;show()")+sel(regOpts(1),f.region,"S.f.region=this.value;show()")+sel([['',t('all')],...['alarm','missile','uav','warning','info'].map(k=>[k,t(k)])],f.kind,"S.f.kind=this.value;show()")+(x.map(ev).join('')||none)},
async favs(){const fv=S.me.favorites;return fv.map(n=>{const r=S.regions.find(r=>r.region==n);return `<div class="card">${r?tile(r):e(n)}<button class="a" onclick="fav('${e(n)}',0)">${t('del')}</button></div>`}).join('')+sel(regOpts(0),'',"fav(this.value,1)")},
async stats(){const x=await api('/stats?period='+S.sp);return sel([['day',t('day')],['week',t('week')],['month',t('month')]],S.sp,"S.sp=this.value;show()")+`<div class="card"><b>${t('count')}: ${x.count}</b><br>${t('total')}: ${hm(x.seconds)}</div><table>${x.regions.map(r=>`<tr><td>${e(r.region)}</td><td>${r.count}</td><td>${hm(r.seconds)}</td></tr>`).join('')}</table>`},
async safety(){const x=await api('/safety');return `<div class="card"><h3>${t('alert')}</h3><ul>${x.alert.map(i=>`<li>${e(i)}</li>`).join('')}</ul></div><div class="card"><ul>${x.emergency.map(i=>`<li>${e(i)}</li>`).join('')}</ul></div><div class="card"><b>${t('links')}</b><br>${x.links.map(l=>`<a href="${e(l.url)}" target="_blank">${e(l.title)}</a>`).join('<br>')}</div><button class="a" onclick="near()">${t('nearest')}</button><div id="sh"></div>`},
async profile(){const m=S.me,st=m.settings||{},ks=st.kinds||['alarm','missile','uav','warning','clear'];
return `<div class="card">${t('lang')}<br>${sel([['uk','Українська'],['ru','Русский'],['en','English']],m.lang,"S.me.lang=this.value;saveP()")}<br>${t('region')}<br>${sel(regOpts(0),m.region,"S.me.region=this.value")}</div>
<div class="card"><b>${t('notif')}</b><label><input type="checkbox" id="en" ${st.enabled!==false?'checked':''}> ${t('enabled')}</label>${['alarm','missile','uav','warning','clear'].map(k=>`<label><input type="checkbox" class="k" value="${k}" ${ks.includes(k)?'checked':''}> ${k=='clear'?t('ended'):t(k)}</label>`).join('')}
<button class="a" onclick="mute(1)">${t('off1')}</button> <button class="a" onclick="mute(8)">${t('off8')}</button> <button class="a" onclick="mute(0)">${t('on')}</button></div>
<button class="a" onclick="saveP()">${t('save')}</button>${m.is_admin?'<p><a href="/admin.html">Admin</a> · <a href="/status.html">Status</a></p>':'<p><a href="/status.html">Status</a></p>'}`}
};
function collect(){const st=Object.assign({},S.me.settings);st.enabled=$('en')?$('en').checked:st.enabled!==false;if(document.querySelector('.k'))st.kinds=[...document.querySelectorAll('.k:checked')].map(i=>i.value);return st}
async function saveP(){S.me.settings=collect();await put({lang:S.me.lang,region:S.me.region,settings:S.me.settings});show()}
async function mute(h){const st=collect();if(h)st.mute_until=new Date(Date.now()+h*3600e3).toISOString().slice(0,19);else delete st.mute_until;S.me.settings=st;await put({settings:st});show()}
async function fav(n,add){if(!n)return;const s=new Set(S.me.favorites);add?s.add(n):s.delete(n);S.me.favorites=[...s];await put({favorites:S.me.favorites});show()}
function near(){navigator.geolocation.getCurrentPosition(async p=>{const x=await api(`/shelters?lat=${p.coords.latitude}&lon=${p.coords.longitude}`);$('sh').innerHTML=x.map(i=>`<div class="card">${e(i.name)}<br><small>${e(i.address||'')} · ${i.km} km</small></div>`).join('')||none})}
async function show(){$('n').innerHTML=TABS.map(k=>`<button class="${k==S.tab?'on':''}" onclick="S.tab='${k}';show()">${t(k)}</button>`).join('');try{$('m').innerHTML=await V[S.tab]()}catch(x){$('m').innerHTML='<p>Error</p>'}}
(async()=>{S.me=await api('/me');S.regions=await api('/regions');show();setInterval(async()=>{S.regions=await api('/regions');if(['home','map','alerts'].includes(S.tab))show()},30000)})();
</script></body></html>
